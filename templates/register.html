{% extends 'base.html' %}
{% block title %}Personalised Learning — Create Account{% endblock %}

{% block auth_content %}
<div class="auth-wrapper">
    <div class="auth-box">
        <div class="text-center mb-4">
            <div class="d-inline-flex p-3 rounded-circle bg-light text-primary mb-2">
                <i class="bi bi-person-plus-fill fs-2"></i>
            </div>
            <h2 class="h3 fw-bold text-dark mb-1">Create your Personalised Learning account</h2>
            <p class="text-muted small">Join your AI-driven adaptive study platform</p>
        </div>

        <form method="POST" action="{{ url_for('register') }}">
            <input type="hidden" name="_csrf" value="{{ csrf_token() }}">

            <div class="mb-3">
                <label class="form-label fw-semibold small text-secondary">Full Name</label>
                <div class="input-group">
                    <span class="input-group-text bg-light border-end-0"><i class="bi bi-person"></i></span>
                    <input type="text" name="full_name" class="form-control border-start-0" placeholder="e.g. Amish Sharma" required autofocus>
                </div>
            </div>

            <div class="mb-3">
                <label class="form-label fw-semibold small text-secondary">Email Address</label>
                <div class="input-group">
                    <span class="input-group-text bg-light border-end-0"><i class="bi bi-envelope"></i></span>
                    <input type="email" name="email" class="form-control border-start-0" placeholder="amish@university.edu" required>
                </div>
            </div>

            <div class="row g-2 mb-3">
                <div class="col-md-6">
                    <label class="form-label fw-semibold small text-secondary">Password (min. 8 chars)</label>
                    <div class="input-group">
                        <span class="input-group-text bg-light border-end-0"><i class="bi bi-lock"></i></span>
                        <input type="password" name="password" class="form-control border-start-0" placeholder="••••••••" minlength="8" required>
                    </div>
                </div>
                <div class="col-md-6">
                    <label class="form-label fw-semibold small text-secondary">Confirm Password</label>
                    <div class="input-group">
                        <span class="input-group-text bg-light border-end-0"><i class="bi bi-shield-check"></i></span>
                        <input type="password" name="confirm_password" class="form-control border-start-0" placeholder="••••••••" minlength="8" required>
                    </div>
                </div>
            </div>

            <div class="mb-4">
                <label class="form-label fw-semibold small text-secondary">Roll Number <span class="text-muted fw-normal">(optional)</span></label>
                <div class="input-group">
                    <span class="input-group-text bg-light border-end-0"><i class="bi bi-card-text"></i></span>
                    <input type="text" name="roll_number" class="form-control border-start-0" placeholder="e.g. 2026-CSE-042">
                </div>
            </div>

            <button type="submit" class="btn btn-primary w-100 py-2 fw-semibold mb-3 shadow-sm">
                <i class="bi bi-check2-circle me-2"></i>Register & Personalize
            </button>
        </form>

        <div class="text-center mt-3 pt-3 border-top">
            <p class="text-muted small mb-0">
                Already registered? <a href="{{ url_for('login') }}" class="text-primary fw-semibold text-decoration-none">Sign in here</a>
            </p>
        </div>
    </div>
</div>
{% endblock %}
