{% extends "base.html" %}
{% block title %}500 Server Error - Personalised Learning{% endblock %}
{% block fullpage_content %}
<div class="auth-page">
    <div class="text-center">
        <h1 class="display-1 fw-bold" style="color:var(--danger);">500</h1>
        <h3 class="mb-3">Server Error</h3>
        <p class="text-muted mb-4">Something went wrong. Please try again later.</p>
        <a href="{{ url_for('dashboard') if session.get('student_id') else url_for('login') }}" class="btn btn-primary">
            <i class="fas fa-home me-1"></i>Go Home
        </a>
    </div>
</div>
{% endblock %}
