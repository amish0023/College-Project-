{% extends "base.html" %}
{% block title %}404 Not Found - Personalised Learning{% endblock %}
{% block fullpage_content %}
<div class="auth-page">
    <div class="text-center">
        <h1 class="display-1 fw-bold" style="color:var(--primary);">404</h1>
        <h3 class="mb-3">Page Not Found</h3>
        <p class="text-muted mb-4">The page you're looking for doesn't exist.</p>
        <a href="{{ url_for('dashboard') if session.get('student_id') else url_for('login') }}" class="btn btn-primary">
            <i class="fas fa-home me-1"></i>Go Home
        </a>
    </div>
</div>
{% endblock %}
